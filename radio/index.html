<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WCYT Radio</title>
<meta name="description" content="Listen live to WCYT The Point 91FM and 2.0.">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WCYT Radio">
<meta name="robots" content="noindex, nofollow">
<style>
:root { color-scheme: dark; }
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #111; color: #eee;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; min-height: 100%;
}
/* ── Passcode gate ── */
#gate { position: fixed; inset: 0; z-index: 100; background: #111; display: flex;
  align-items: center; justify-content: center; padding: 24px; }
#gate.unlocked { display: none; }
.gate-card { width: 100%; max-width: 300px; text-align: center; }
.gate-card img { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 16px; }
.gate-card h2 { font-size: 17px; font-weight: 800; margin-bottom: 6px; }
.gate-card p { font-size: 13px; color: #888; margin-bottom: 20px; }
.gate-card input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #eee;
  padding: 13px 14px; border-radius: 10px; font-size: 20px; text-align: center;
  letter-spacing: .3em; outline: none; margin-bottom: 12px; }
.gate-card input:focus { border-color: #c8102e; }
.gate-card button { width: 100%; background: #c8102e; color: #fff; border: none;
  padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.gate-error { font-size: 12px; color: #f87171; margin-top: 10px; min-height: 16px; }
#app { display: none; }
#app.unlocked { display: flex; flex-direction: column; flex: 1; }

.header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.header img { width: 34px; height: 34px; border-radius: 8px; }
.header h1 { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
.header .sub { font-size: 11px; color: #888; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #aaa;
  padding: 11px 8px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.tab.active { background: #c8102e; border-color: #c8102e; color: #fff; }

.player-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 18px;
  padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.art-wrap { width: 220px; height: 220px; max-width: 60vw; max-height: 60vw; border-radius: 16px;
  overflow: hidden; background: #222; margin-bottom: 18px; position: relative;
  box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.art-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.live-dot { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 5px;
  background: rgba(0,0,0,.55); padding: 4px 8px 4px 6px; border-radius: 20px; font-size: 10px;
  font-weight: 800; letter-spacing: .08em; color: #fff; }
.live-dot .dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
.live-dot .dot.paused { background: #666; }

#np-artist { font-size: 20px; font-weight: 800; line-height: 1.25; }
#np-title  { font-size: 15px; color: #bbb; margin-top: 3px; }
#np-album  { font-size: 12px; color: #777; margin-top: 5px; }
.station-tagline { font-size: 11px; color: #c8102e; font-weight: 700; letter-spacing: .08em;
  margin-top: 10px; text-transform: uppercase; }

.controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 22px; }
.play-btn { width: 68px; height: 68px; border-radius: 50%; background: #c8102e; border: none;
  color: #fff; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(200,16,46,.4); }
.play-btn:active { transform: scale(.96); }
.vol-wrap { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 18px; }
.vol-wrap span { font-size: 14px; color: #888; }
.vol-wrap input { flex: 1; accent-color: #c8102e; }

.flag-row { width: 100%; margin-top: 20px; }
.flag-btn { width: 100%; background: #2a2a2a; border: 1px solid #3a3a3a; color: #f59e0b;
  padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.flag-btn:disabled { color: #16a34a; border-color: #16a34a44; cursor: default; }
.flag-btn:hover:not(:disabled) { border-color: #f59e0b; }

.flag-panel { width: 100%; margin-top: 12px; background: #201a12; border: 1px solid #f59e0b55;
  border-radius: 10px; padding: 14px; text-align: left; display: none; }
.flag-panel.open { display: block; }
.flag-panel p { font-size: 13px; color: #ddd; margin-bottom: 10px; line-height: 1.4; }
.flag-panel textarea { width: 100%; background: #161616; border: 1px solid #3a3a3a; color: #eee;
  border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical;
  min-height: 44px; margin-bottom: 10px; }
.flag-panel .row { display: flex; gap: 8px; }
.flag-panel button { flex: 1; border: none; padding: 10px; border-radius: 8px; font-size: 13px;
  font-weight: 700; cursor: pointer; }
.btn-confirm { background: #f59e0b; color: #1a1200; }
.btn-cancel  { background: #2a2a2a; color: #ccc; }
.flag-status { font-size: 12px; margin-top: 8px; min-height: 16px; }
.flag-status.err { color: #f87171; }
.flag-status.ok  { color: #86efac; }

.recent { margin-top: 26px; }
.recent h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #666;
  margin-bottom: 10px; }
.recent ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.recent li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.recent .who { color: #ddd; }
.recent .who b { font-weight: 700; }
.recent .time { color: #666; flex-shrink: 0; }

.offline-banner { background: #3f1d1d; border: 1px solid #b91c1c; color: #fca5a5; font-size: 13px;
  padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
.offline-banner.show { display: block; }
footer { margin-top: auto; padding-top: 24px; text-align: center; font-size: 11px; color: #444; }
footer a { color: #666; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <img src="icons/icon-192.png" alt="">
    <h2>WCYT Radio</h2>
    <p>Personal — enter your passcode</p>
    <input type="password" inputmode="numeric" id="gate-input" maxlength="20"
           autocomplete="off" onkeydown="if(event.key==='Enter')checkPasscode()">
    <button onclick="checkPasscode()">Unlock</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<div id="app">

<div class="header">
  <img src="icons/icon-192.png" alt="">
  <div>
    <h1>WCYT Radio</h1>
    <div class="sub">Fort&nbsp;Wayne, Indiana &middot; 91.1&nbsp;FM</div>
  </div>
</div>

<div id="offline-banner" class="offline-banner"></div>

<div class="tabs">
  <button class="tab active" id="tab-wcyt" onclick="switchStation('wcyt')">The Point</button>
  <button class="tab" id="tab-2pt0" onclick="switchStation('2pt0')">2.0</button>
</div>

<div class="player-card">
  <div class="art-wrap">
    <img id="art-img" src="icons/icon-512.png" alt="">
    <div class="live-dot"><span class="dot paused" id="live-dot-el"></span><span id="live-label">PAUSED</span></div>
  </div>

  <div id="np-artist">Loading&hellip;</div>
  <div id="np-title"></div>
  <div id="np-album"></div>
  <div class="station-tagline" id="station-tagline">Where Music is the Point</div>

  <div class="controls">
    <button class="play-btn" id="play-btn" onclick="togglePlay()" aria-label="Play">&#9658;</button>
  </div>
  <div class="vol-wrap">
    <span>&#128266;</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
  </div>

  <div class="flag-row">
    <button class="flag-btn" id="flag-btn" onclick="openFlagPanel()">&#128681; Flag this song</button>
    <div class="flag-panel" id="flag-panel">
      <p id="flag-prompt"></p>
      <textarea id="flag-note" maxlength="300" placeholder="Optional — why should this come off the playlist?"></textarea>
      <div class="row">
        <button class="btn-cancel" onclick="closeFlagPanel()">Cancel</button>
        <button class="btn-confirm" id="flag-confirm-btn" onclick="submitFlag()">Report song</button>
      </div>
      <div class="flag-status" id="flag-status"></div>
    </div>
  </div>
</div>

<div class="recent">
  <h2>Recently played</h2>
  <ul id="recent-list"></ul>
</div>

<footer>WCYT &middot; wcyt.org</footer>

</div><!-- #app -->

<script>
'use strict';

const RAW_BASE     = 'https://raw.githubusercontent.com/dunnand/WCYT-NowPlaying/main';
const DJPANEL_URL  = 'https://script.google.com/macros/s/AKfycbwV99T1Owt69gFQYtdOmqGUJjtMME1y0bUBjJ9XHN1CjzPXMhfPeI8xNFZOUUI6hsB7/exec';
const OVERRIDES_URL = '/images/art_overrides.json';
const FALLBACK_ART  = { wcyt: 'icons/icon-512.png', '2pt0': 'icons/icon-512.png' };
const POLL_MS       = 10_000;
const FLAG_COOLDOWN_MS = 10 * 60 * 1000; // don't let one device spam-flag the same song

const STATIONS = {
  wcyt: {
    label: 'The Point', tagline: 'Where Music is the Point',
    stream: 'https://securestreams2.autopo.st:1069/WCYT.mp3',
    nowFile: '/point_recent.json',
  },
  '2pt0': {
    label: '2.0', tagline: 'The Next Level of Radio',
    stream: 'https://securestreams2.autopo.st:1069/wcythd2.mp3',
    nowFile: '/wcyt2_recent.json',
  },
};

let station     = localStorage.getItem('wcyt-radio-station') || 'wcyt';
let overrides   = {};
let nowData     = null;
let pollTimer   = null;
let isPlaying   = false;
const audio     = new Audio();
audio.preload   = 'none';

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

// ── Art lookup — mirrors playlist-widget.js/display.htm: art comes ONLY
// from the curated, human-approved overrides file, never a live lookup, so
// nothing unreviewed can ever show here either. ─────────────────────────
function artKey(artist, title) {
  return (artist + '|' + (title || '')).toLowerCase();
}
function resolveArt(artist, album) {
  if (!album) return null;
  const m = album.match(/^(.+?)\s*[•·]\s*\d{4}\s*$/);
  const albumName = m ? m[1].trim() : album.trim();
  if (!albumName) return null;
  const key = artKey(artist, albumName);
  return overrides[key] || null;
}
async function loadOverrides() {
  try {
    const res = await fetch(OVERRIDES_URL, { cache: 'no-cache' });
    const data = await res.json();
    overrides = data.overrides || {};
  } catch { /* fine — art just falls back to the station logo */ }
}

// ── Now playing ───────────────────────────────────────────────────────
function setOffline(msg) {
  const el = document.getElementById('offline-banner');
  if (msg) { el.textContent = msg; el.classList.add('show'); }
  else      { el.classList.remove('show'); }
}

async function pollNowPlaying() {
  try {
    const res = await fetch(RAW_BASE + STATIONS[station].nowFile, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    nowData = await res.json();
    setOffline(null);
    renderNow();
  } catch (e) {
    setOffline('Can’t reach the now-playing feed — audio still streams live.');
  }
}

function renderNow() {
  if (!nowData || !nowData.now) return;
  const n = nowData.now;
  document.getElementById('np-artist').textContent = n.artist || 'WCYT';
  document.getElementById('np-title').textContent  = n.title || '';
  document.getElementById('np-album').textContent  = n.album || '';

  const artUrl = resolveArt(n.artist, n.album);
  document.getElementById('art-img').src = artUrl || FALLBACK_ART[station];

  const list = document.getElementById('recent-list');
  list.innerHTML = '';
  (nowData.recent || []).slice(0, 8).forEach((r) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="who"><b>' + esc(r.artist) + '</b> — ' + esc(r.title) + '</span>'
      + '<span class="time">' + esc(r.time || '') + '</span>';
    list.appendChild(li);
  });

  refreshFlagButtonState();
}

// ── Station switching ────────────────────────────────────────────────
function switchStation(s) {
  if (s === station) return;
  station = s;
  localStorage.setItem('wcyt-radio-station', s);
  document.getElementById('tab-wcyt').classList.toggle('active', s === 'wcyt');
  document.getElementById('tab-2pt0').classList.toggle('active', s === '2pt0');
  document.getElementById('station-tagline').textContent = STATIONS[s].tagline;
  document.getElementById('np-artist').textContent = 'Loading…';
  document.getElementById('np-title').textContent = '';
  document.getElementById('np-album').textContent = '';
  document.getElementById('art-img').src = FALLBACK_ART[s];
  closeFlagPanel();

  const wasPlaying = isPlaying;
  audio.pause();
  audio.src = STATIONS[s].stream;
  if (wasPlaying) audio.play().catch(onPlayError);

  nowData = null;
  pollNowPlaying();
}

// ── Playback ──────────────────────────────────────────────────────────
function onPlayError(e) {
  setOffline('Couldn’t start the stream — check your connection and try again.');
  setPlayingUI(false);
}
function setPlayingUI(playing) {
  isPlaying = playing;
  document.getElementById('play-btn').innerHTML = playing ? '&#10074;&#10074;' : '&#9658;';
  document.getElementById('play-btn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
  document.getElementById('live-dot-el').classList.toggle('paused', !playing);
  document.getElementById('live-label').textContent = playing ? 'LIVE' : 'PAUSED';
}
function togglePlay() {
  if (isPlaying) {
    audio.pause();
    setPlayingUI(false);
    return;
  }
  if (!audio.src) audio.src = STATIONS[station].stream;
  setOffline(null);
  audio.play().then(() => setPlayingUI(true)).catch(onPlayError);
}
function setVolume(v) { audio.volume = parseFloat(v); }
audio.addEventListener('waiting', () => setOffline('Buffering…'));
audio.addEventListener('playing', () => setOffline(null));
audio.addEventListener('error', () => onPlayError());
audio.addEventListener('pause', () => { if (isPlaying) setPlayingUI(false); });

// ── Flagging ──────────────────────────────────────────────────────────
function flaggedSongsMap() {
  try { return JSON.parse(localStorage.getItem('wcyt-radio-flagged') || '{}'); } catch { return {}; }
}
function saveFlaggedSongsMap(m) { localStorage.setItem('wcyt-radio-flagged', JSON.stringify(m)); }

function currentSongFingerprint() {
  if (!nowData || !nowData.now || !nowData.now.artist) return null;
  return station + '|' + artKey(nowData.now.artist, nowData.now.title);
}

function refreshFlagButtonState() {
  const btn = document.getElementById('flag-btn');
  const fp = currentSongFingerprint();
  if (!fp) { btn.disabled = true; btn.textContent = '\u{1F6A9} Flag this song'; return; }
  const flagged = flaggedSongsMap();
  const ts = flagged[fp];
  if (ts && Date.now() - ts < FLAG_COOLDOWN_MS) {
    btn.disabled = true;
    btn.textContent = '✓ Flagged — thanks';
  } else {
    btn.disabled = false;
    btn.textContent = '\u{1F6A9} Flag this song';
  }
}

function openFlagPanel() {
  if (!nowData || !nowData.now) return;
  const n = nowData.now;
  document.getElementById('flag-prompt').textContent =
    'Report "' + (n.title || 'this song') + '" by ' + (n.artist || 'this artist') + ' for review?';
  document.getElementById('flag-note').value = '';
  document.getElementById('flag-status').textContent = '';
  document.getElementById('flag-status').className = 'flag-status';
  document.getElementById('flag-panel').classList.add('open');
}
function closeFlagPanel() {
  document.getElementById('flag-panel').classList.remove('open');
}

async function submitFlag() {
  const n = nowData && nowData.now;
  if (!n || !n.artist) return;
  const confirmBtn = document.getElementById('flag-confirm-btn');
  const statusEl   = document.getElementById('flag-status');
  confirmBtn.disabled = true;
  statusEl.className = 'flag-status';
  statusEl.textContent = 'Sending…';

  const body = {
    action: 'flagSong',
    station: station,
    artist: n.artist,
    title:  n.title || '',
    album:  n.album || '',
    note:   document.getElementById('flag-note').value.trim().slice(0, 300),
  };

  try {
    const res = await fetch(DJPANEL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight to Apps Script
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'server error');

    const fp = currentSongFingerprint();
    if (fp) {
      const m = flaggedSongsMap();
      m[fp] = Date.now();
      saveFlaggedSongsMap(m);
    }
    statusEl.textContent = 'Reported — thank you.';
    statusEl.className = 'flag-status ok';
    refreshFlagButtonState();
    setTimeout(closeFlagPanel, 1400);
  } catch (e) {
    statusEl.textContent = 'Couldn’t send — check your connection and try again.';
    statusEl.className = 'flag-status err';
  } finally {
    confirmBtn.disabled = false;
  }
}

// ── Passcode gate — personal use only, not a public station feature.
// Client-side only (same pattern as dj.html's DJ panel login): the page
// source is always fetchable since this is static hosting, but a stumbled-on
// URL or a search-engine crawl won't produce anything usable without it.
// To change the passcode: pick a new one, hash it (Python: hashlib.sha256(
// b'yourcode').hexdigest()), and replace GATE_HASH below.
const GATE_HASH    = '90095fe92ecf6b77b8e7669fcd6cb7c6f60e7f000997e12450146b7032de8afb';
const GATE_LS_KEY  = 'wcyt-radio-passcode';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlockApp() {
  document.getElementById('gate').classList.add('unlocked');
  document.getElementById('app').classList.add('unlocked');
  startApp();
}

async function checkPasscode() {
  const input = document.getElementById('gate-input');
  const code  = input.value.trim();
  if (await sha256(code) === GATE_HASH) {
    localStorage.setItem(GATE_LS_KEY, code);
    unlockApp();
  } else {
    document.getElementById('gate-error').textContent = 'Wrong passcode.';
    input.value = '';
    input.focus();
  }
}

(async function initGate() {
  const saved = localStorage.getItem(GATE_LS_KEY);
  if (saved && await sha256(saved) === GATE_HASH) {
    unlockApp();
  } else {
    document.getElementById('gate-input').focus();
  }
})();

// ── App init — runs once, after the passcode gate is passed ─────────────
let appStarted = false;
function startApp() {
  if (appStarted) return;
  appStarted = true;

  document.getElementById('tab-' + station).classList.add('active');
  if (station === '2pt0') document.getElementById('tab-wcyt').classList.remove('active');
  document.getElementById('station-tagline').textContent = STATIONS[station].tagline;
  document.getElementById('art-img').src = FALLBACK_ART[station];
  audio.src = STATIONS[station].stream;
  setVolume(document.getElementById('vol').value);

  loadOverrides().then(() => { pollNowPlaying(); pollTimer = setInterval(pollNowPlaying, POLL_MS); });

  // No 'load' listener here — by the time startApp() runs (after the user
  // clears the passcode gate) window's load event has long since fired.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
</script>
</body>
</html>
