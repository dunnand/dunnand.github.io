<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Team &mdash; The Point 91 FM &middot; WCYT</title>
  <meta name="description" content="Meet the student DJs, hosts, and staff behind The Point 91 FM — WCYT at Homestead High School.">
  <link rel="icon" type="image/x-icon" href="/images/squarespace/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:  #0d0d0d;
      --dark:   #111111;
      --mid:    #1a1a1a;
      --border: #222222;
      --accent: #c8102e;
      --muted:  #888888;
      --white:  #ffffff;
      --font:   'Space Grotesk', sans-serif;
    }

    html { font-family: var(--font); background: var(--black); color: var(--white); }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    a    { color: inherit; text-decoration: none; }

    /* ── Page header ── */
    .page-header {
      background: var(--black);
      color: var(--white);
      padding: 48px 32px 40px;
      border-bottom: 3px solid var(--accent);
    }
    .page-header-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 8px;
    }
    .page-header h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 700;
      line-height: 1.1;
    }
    .page-header h1 strong { color: var(--accent); }
    .page-header-note {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
    }

    /* ── Main ── */
    .team-main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── Section heading ── */
    .team-section-heading {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 32px;
    }

    /* ── Grid ── */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 28px;
      margin-bottom: 60px;
    }

    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      padding: 20px 12px;
      background: var(--mid);
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .team-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }

    .team-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 2px solid var(--border);
      transition: border-color .2s;
      background: #333;
    }
    .team-card:hover .team-photo { border-color: var(--accent); }

    .team-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .team-role {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .team-show {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .team-time {
      display: block;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* ── Managers grid (fewer, larger) ── */
    .team-grid--mgmt {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      max-width: 520px;
    }
    .team-grid--mgmt .team-photo {
      width: 180px;
      height: 180px;
    }
    .team-grid--mgmt .team-name { font-size: 17px; }
    .team-grid--mgmt .team-role {
      font-size: 13px;
      color: var(--accent);
      font-weight: 500;
    }

    /* ── Footer ── */
    .site-footer {
      background: var(--black);
      color: #444;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      border-top: 1px solid #1a1a1a;
    }
    .site-footer a { color: #666; }
    .site-footer a:hover { color: #aaa; }

    @media (max-width: 600px) {
      .page-header { padding: 32px 20px 28px; }
      .team-main { padding: 32px 16px 60px; }
      .team-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; }
    }
  </style>
</head>

<body>

  <header class="page-header">
    <div class="page-header-eyebrow">The Point 91 FM &middot; WCYT</div>
    <h1>Our <strong>Team</strong></h1>
    <p class="page-header-note">The student DJs, hosts, and staff behind the station.</p>
  </header>

  <main class="team-main">
    <div class="team-section-heading">Radio Personalities</div>
    <div class="team-grid" id="team-personalities"></div>
    <div class="team-section-heading" id="team-mgmt-heading" style="display:none">Management</div>
    <div class="team-grid team-grid--mgmt" id="team-management"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; WCYT &middot; The Point 91 FM &middot; Homestead High School, Fort Wayne, IN</p>
  </footer>

  <script src="/nav.js"></script>
  <script src="/playlist-widget.js"></script>
  <script>WCYTPlaylist.init(null, null, null);</script>

  <script>
    // ─────────────────────────────────────────────────────────────────────────
    // TEAM PAGE — reads the roster from the same Apps Script backend that
    // powers the DJ Panel (dj.html → "Team Roster"). Manage the roster there
    // instead of a spreadsheet — add/edit/remove team members, upload a
    // photo, and this page picks it up automatically (data.team from doGet()
    // in dj-backend.gs). A student with multiple shows gets one row per show
    // in the panel, sharing the same name — they're grouped onto one card
    // below, same as before.
    // ─────────────────────────────────────────────────────────────────────────
    const TEAM_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwV99T1Owt69gFQYtdOmqGUJjtMME1y0bUBjJ9XHN1CjzPXMhfPeI8xNFZOUUI6hsB7/exec';

    // Built-in fallback data — used only if the backend can't be reached.
    // Radio Personalities are managed entirely from the DJ panel now (no
    // fallback needed there); Management is fixed and kept here too so the
    // page still shows leadership even if the backend is down.
    const FALLBACK_MEMBERS = [
      { name: 'Andy Dunn',        show: 'General Manager',            time: '',  photo: '/images/squarespace/P1083956.jpg',        section: 'Management' },
      { name: 'Adam Schenkel',    show: 'Radio/TV Director',          time: '',  photo: '/images/squarespace/P1083964.jpg',        section: 'Management' },
    ];

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function photoUrl(url) {
      const m = (url || '').match(/\/d\/([^/?]+)/);
      return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w500` : url;
    }

    // Group rows by name so multi-show students appear on one card
    function groupByName(members) {
      const map = new Map();
      for (const m of members) {
        // Normalize: collapse all whitespace types, strip invisible chars, lowercase
        const key = (m.name || '').replace(/[\s\u00a0\u200b]+/g, ' ').trim().toLowerCase();
        if (!map.has(key)) {
          map.set(key, { name: m.name, photo: m.photo, section: m.section, shows: [] });
        }
        if (m.show) map.get(key).shows.push({ show: m.show, time: m.time || '' });
      }
      return [...map.values()];
    }

    function renderGrid(el, members) {
      const grouped = groupByName(members);
      el.innerHTML = grouped.map(m => {
        const showsHtml = m.shows.map(s =>
          `<div class="team-show">${esc(s.show)}${s.time ? `<span class="team-time">${esc(s.time)}</span>` : ''}</div>`
        ).join('');
        return `
        <div class="team-card">
          <img class="team-photo" src="${esc(photoUrl(m.photo))}" alt="${esc(m.name)}" loading="lazy"
               onerror="this.style.opacity='0'">
          <div class="team-name">${esc(m.name)}</div>
          <div class="team-role">${showsHtml}</div>
        </div>`;
      }).join('');
    }

    function renderTeam(members) {
      const personalities = members.filter(m => m.section !== 'Management');
      const management    = members.filter(m => m.section === 'Management');
      renderGrid(document.getElementById('team-personalities'), personalities);
      if (management.length) {
        document.getElementById('team-mgmt-heading').style.display = '';
        renderGrid(document.getElementById('team-management'), management);
      }
    }

    if (TEAM_SCRIPT_URL) {
      fetch(TEAM_SCRIPT_URL, { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          const team = data.team || [];
          if (!team.length) { renderTeam(FALLBACK_MEMBERS); return; }
          renderTeam(team.map(m => ({ name: m.name, show: m.show, time: m.time, photo: m.url, section: m.section })));
        })
        .catch(() => renderTeam(FALLBACK_MEMBERS));
    } else {
      renderTeam(FALLBACK_MEMBERS);
    }
  </script>

</body>
</html>
